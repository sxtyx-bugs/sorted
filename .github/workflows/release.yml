name: SORTED Production Build & Multi-Platform Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. macOS Build & DMG Packaging (Apple Silicon arm64)
  # ============================================================================
  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6.6.3 (macOS Clang)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtimageformats'

      - name: Install Ninja & Packaging Tools
        run: |
          brew install ninja create-dmg

      - name: Configure CMake (arm64 Release)
        run: |
          cmake -B build-macos-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Compile Application & Tests
        run: |
          cmake --build build-macos-arm64 --config Release --parallel

      - name: Run C++ Verification Tests
        run: |
          ctest --test-dir build-macos-arm64 --output-on-failure

      - name: Package macOS DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x packaging/macos/create_dmg.sh
          bash packaging/macos/create_dmg.sh \
            build-macos-arm64/SORTED.app \
            dist/macos/SORTED-1.0.0-macOS-arm64.dmg

      - name: Upload arm64 DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SORTED-1.0.0-macOS-arm64
          path: dist/macos/SORTED-1.0.0-macOS-arm64.dmg
          if-no-files-found: error

  # ============================================================================
  # 2. macOS Build & DMG Packaging (Intel x86_64)
  # ============================================================================
  build-macos-x86_64:
    name: Build macOS (Intel x86_64)
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6.6.3 (macOS Clang)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtimageformats'

      - name: Install Ninja & Packaging Tools
        run: |
          brew install ninja create-dmg

      - name: Configure CMake (x86_64 Release)
        run: |
          cmake -B build-macos-x86_64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Compile Application & Tests
        run: |
          cmake --build build-macos-x86_64 --config Release --parallel

      - name: Run C++ Verification Tests
        run: |
          ctest --test-dir build-macos-x86_64 --output-on-failure

      - name: Package macOS DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x packaging/macos/create_dmg.sh
          bash packaging/macos/create_dmg.sh \
            build-macos-x86_64/SORTED.app \
            dist/macos/SORTED-1.0.0-macOS-x86_64.dmg

      - name: Upload x86_64 DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SORTED-1.0.0-macOS-x86_64
          path: dist/macos/SORTED-1.0.0-macOS-x86_64.dmg
          if-no-files-found: error

  # ============================================================================
  # 3. Windows 64-bit Build & Installer Packaging
  # ============================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6.6.3 (MSVC 2019 x64)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtimageformats'

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Configure CMake (MSVC Release)
        run: |
          cmake -B build-win -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Compile Application & Tests
        run: |
          cmake --build build-win --config Release --parallel

      - name: Run C++ Verification Tests
        run: |
          ctest --test-dir build-win -C Release --output-on-failure

      - name: Package Windows Installer & Portable ZIP
        shell: pwsh
        run: |
          $env:PATH = "${{ env.Qt6_DIR }}\bin;$env:PATH"
          powershell -ExecutionPolicy Bypass -File packaging/windows/package_windows.ps1 -BuildDir "build-win/Release" -OutputDir "dist/windows"

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: SORTED-1.0.0-windows-x64-Setup
          path: dist/windows/SORTED-1.0.0-windows-x64-Setup.exe
          if-no-files-found: warn

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SORTED-1.0.0-windows-x64-portable
          path: dist/windows/SORTED-1.0.0-windows-x64.zip
          if-no-files-found: error

  # ============================================================================
  # 4. GitHub Release Publication
  # ============================================================================
  publish-release:
    name: Publish Release Artifacts
    needs: [build-macos-arm64, build-macos-x86_64, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts Structure
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SORTED ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-release/*
